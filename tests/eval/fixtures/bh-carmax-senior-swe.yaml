description: 'Senior Software Engineer, strong backend/distributed-systems profile, CarMax hybrid JD'

vars:
  client_name: CarMax
  role_title: Senior Software Engineer
  jd_text: |
    CarMax is seeking a Senior Software Engineer with strong backend development
    experience to help design, build, and maintain scalable, high-quality systems
    supporting critical business capabilities. Primarily focused on object-oriented
    backend engineering, with opportunities to collaborate with AI/ML and data teams.

    This is a hands-on individual contributor role with expectations around technical
    ownership, mentoring, and delivering well-designed backend solutions.

    Key Responsibilities:
    - Design, develop, and maintain backend services and APIs using object-oriented
      languages such as Java, .NET, Python, or similar
    - Contribute to system design discussions and help implement scalable, reliable solutions
    - Own features and services end-to-end, from design through deployment and support
    - Collaborate with product managers, designers, and partner engineering teams
    - Participate in code reviews and help ensure engineering best practices for quality,
      performance, and security
    - Troubleshoot and resolve production issues, with a focus on system reliability
      and maintainability
    - Support cloud-native development practices, CI/CD pipelines, and service-oriented
      architectures

    Qualifications:
    - Proven experience as a Senior Software Engineer focused on backend development
    - Strong proficiency in object-oriented programming and backend system design
    - Experience building and supporting distributed systems and APIs
    - Working knowledge of cloud platforms (AWS, Azure, or GCP)
    - Experience with relational and/or NoSQL databases
    - Ability to work independently while collaborating effectively within a team

    Preferred Skills:
    - Exposure to machine learning or data-driven systems, including supporting model integrations
    - Familiarity with AI/ML concepts or workflows in a production environment
    - Experience working alongside data science or ML engineering teams

    Location: CarMax Technology Hub, Plano TX (hybrid, 2 days/week onsite).
    Work Authorization: Must be authorized to work in US, no sponsorship.
  parsed_profile:
    name: Barton Holdridge
    email: bartonholdridge@gmail.com
    phone: '817-676-2145'
    location: Dallas, TX 75216
    linkedin_url: linkedin.com/in/barton-holdridge
    current_title: Fractional AI Engineer
    work_authorization: No Sponsorship Required
    total_experience: 10+ years
    summary: >-
      Software Engineer with 10+ years of experience building and deploying
      cloud-native AI and backend systems across IT, Insurtech, Manufacturing,
      and Government Defense sectors for mid-size and Fortune 500 companies
      (such as Amazon AWS and Lockheed Martin). Proven track record of designing
      distributed microservice architectures, shipping LLM-powered workflows
      end-to-end, and scaling backend services to 99.9%+ availability supporting
      1M+ users and $100B+ in revenue. Experienced partnering with
      cross-functional teams across Engineering, Product, and senior leadership
      to align system architecture with business goals. Skilled in agent
      orchestration, CI/CD pipeline automation, performance optimization, and
      observability tooling to drive reliability, engineering velocity, and AI
      output quality.
    seniority_level: Senior
    career_highlights:
      - 'Increased concurrent workflow throughput 10x by redesigning SQL architecture, introducing async workflows, and decomposing core services into microservices.'
      - 'Reduced manual claims review effort ~70% by designing and implementing an AI-driven document processing pipeline for +$100M in insurance claims.'
      - 'Increased control plane service TPS 600% by profiling and resolving bottlenecks in dependency services across 30+ AWS regions.'
      - 'Completed zero-downtime security upgrades across 2,500 hosts by upgrading 10 microservices with staged rollouts and deployment safeguards.'
      - 'Accelerated engineer ramp time for 4 new engineers by establishing code review cadences, enforcing engineering standards, and mentoring across multiple microservices.'
    selected_experience:
      - company: Fractional AI Engineer
        title: Fractional AI Engineer
        start_date: '2025-01'
        end_date: Present
        responsibilities:
          - 'Built and operated an AI-powered multi-tenant SaaS platform processing +$100M in insurance claims, serving as the sole technical decision-maker in a 0-to-1 environment'
          - 'Designed and maintained backend APIs, microservices, async workflows, and third-party integrations supporting end-to-end insurance claims automation'
          - 'Defined system architecture and technical strategy to balance speed, cost, and scalability across AI-driven workflows and cloud infrastructure'
          - 'Contributed to technical design documentation and implemented business logic, data models, and third-party integrations for AI-driven claims processing features'
        achievements:
          - 'Reduced manual claims review effort ~70% by designing and implementing an AI-driven document processing pipeline for +$100M in insurance claims'
          - 'Increased concurrent workflow throughput 10x by redesigning SQL architecture, introducing async workflows, and decomposing core services into microservices'
          - 'Improved AI workflow success rate to 95% across multi-minute document-processing jobs by implementing durable Temporal orchestration with retries, idempotency, and failure recovery'
          - 'Reduced mean time to deploy 80% in 90 days by provisioning ECS/RDS and building CI/CD pipelines on AWS'
      - company: Amazon AWS
        title: Software Engineer II
        start_date: '2022-01'
        end_date: '2025-01'
        responsibilities:
          - 'Engineered backend services across 30+ AWS regions, supporting 2,500+ hosts at 99.9%+ availability'
          - 'Designed and maintained distributed microservice architectures with fault-tolerant patterns and safeguards for cloud infrastructure provisioning'
          - 'Monitored production systems via on-call rotations, investigated incidents, and implemented long-term reliability fixes'
          - 'Mentored 4 engineers across multiple microservices through code reviews and engineering standards'
          - 'Contributed to technical design discussions for new features, services, and architectural changes'
        achievements:
          - 'Completed zero-downtime security upgrades across 2,500 hosts by upgrading 10 microservices with staged rollouts and deployment safeguards'
          - 'Increased control plane service TPS 600% by profiling and resolving bottlenecks in dependency services across 30+ AWS regions'
          - 'Reduced account creation time 50% by architecting a CI/CD pipeline managing accounts and permissions across 30+ regions'
          - 'Saved 1 year of Dev effort by standardizing launch plans, owners, and readiness reviews across 5 teams'
          - 'Reduced on-call weekly reporting effort 50% by building a tool linking service faults to tickets, graph overlays, and logs'
      - company: Lockheed Martin
        title: Senior Software Engineer
        start_date: '2017-01'
        end_date: '2022-01'
        responsibilities:
          - 'Developed full-stack software for an $80M ground-based radar contract across the full software lifecycle'
          - 'Wrote clean, tested, and maintainable code; conducted code reviews and pair programming to mentor junior engineers'
          - 'Collaborated with systems, test, and program teams to refine requirements and deliver iterative features via Agile sprint cycles'
          - 'Contributed to technical design discussions and documentation for radar tracking features'
        achievements:
