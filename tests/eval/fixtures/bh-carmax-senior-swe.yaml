assert:
  # Core backend/distributed systems experience IS in the profile — must appear
  - type: javascript
    value: |
      const s = (output.fit_summary + ' ' + output.fit_bullets.map(b => b.text).join(' ')).toLowerCase()
      return s.includes('distributed') || s.includes('microservice') || s.includes('backend') || s.includes('api')
  # AWS/cloud experience is a direct JD requirement and clearly in the profile
  - type: javascript
    value: |
      const s = (output.fit_summary + ' ' + output.fit_bullets.map(b => b.text).join(' ')).toLowerCase()
      return s.includes('aws') || s.includes('cloud') || s.includes('amazon')
  # Quality: confident strong-fit narrative without fabricating .NET experience
  - type: llm-rubric
    value: |
      The narrative confidently leads with Barton's depth as a backend and distributed
      systems engineer, anchoring on his three-year tenure at Amazon AWS (30+ regions,
      2,500 hosts, 99.9%+ availability, 600% TPS increase). It does not pad with generic
      statements, does not fabricate .NET experience which is absent from the profile,
      and does not obscure the strong fit behind unnecessary caveats. The fractional/contract
      nature of his most recent role may be briefly noted if relevant but should not
      dominate or undermine the overall strong-fit narrative.
