      - Data Analytics
      - Networking & Infrastructure

assert:
  # Liaison/cadence work is the core of the interlock role and directly in the profile
  - type: javascript
    value: |
      const all = (
        (output.fit_summary || '') + ' ' +
        (output.fit_bullets || []).map(b => b.text).join(' ')
      ).toLowerCase()
      return (
        all.includes('cadence') || all.includes('liaison') ||
        all.includes('cross-functional') || all.includes('operating cadence') ||
        all.includes('stakeholder')
      )
  # Deal desk, partner ops, and enablement are explicit JD requirements covered by Cisco channel role
  - type: javascript
    value: |
      const all = (
        (output.fit_summary || '') + ' ' +
        (output.fit_bullets || []).map(b => b.text).join(' ')
      ).toLowerCase()
      return (
        all.includes('deal desk') || all.includes('partner') ||
        all.includes('enablement') || all.includes('channel') ||
        all.includes('trained') || all.includes('adoption')
      )
  # Quality: grounded in Cisco/Alteryx specifics, no fabricated Autodesk product knowledge
  - type: llm-rubric
    value: |
      The narrative leads with DeLuca's strength as a GTM interlock and liaison — specifically
      his experience running cross-functional operating cadences, translating field priorities
      into requirements, and delivering executive readouts — grounded in concrete Cisco and
      Alteryx examples. It does not fabricate Autodesk-specific product knowledge or claim he
      has authored Autodesk sales plays or worked in design/manufacturing software verticals.
      The Cisco channel role's direct relevance to Deal Desk and Partner Operations oversight
      should be acknowledged.
