description: 'Fractional Scrum Master, software engineer with Agile experience but no Scrum certification'

vars:
  client_name: GPU Infrastructure Startup
  role_title: Fractional Scrum Master
  jd_text: |
    GPU infrastructure startup providing high-performance, single-tenant GPU infrastructure for AI teams, inference platforms, and cloud providers.

    Looking for a fractional Scrum Master starting late June / early July to support a cross-functional team (engineers, growth associate, founding members) by facilitating Agile ceremonies, removing impediments, and coaching on Scrum best practices.

    What you will do:
    - Facilitate daily standups, sprint planning, sprint reviews, and retrospectives
    - Own and maintain Trello board with color-coded dependency tracking
    - Support a cross-functional team including ops, growth, business pipelines
    - Advise on how to structure Trello cards, labels, checklists, dependencies
    - Help remove blockers and keep team accountable to sprint goals
    - Proactively coach the team on Scrum best practices
    - Call out non-Scrum behaviors constructively

    What we are looking for:
    - PSM I or II (Scrum.org) or CSM certified
    - 3+ years as a Scrum Master, ideally in startups or distributed remote teams
    - Experience facilitating ceremonies beyond engineering (ops, growth, business pipelines)
    - Proficient in Trello, experience setting up boards for cross-functional teams
    - Comfortable coaching founders when processes are not being followed

    Engagement: 6-10 hrs/week, fully remote, contract. Start: late June/early July.
  parsed_profile:
