      - 'Increased control plane service TPS 600% by profiling and resolving bottlenecks in dependency services across 30+ AWS regions.'
      - 'Completed zero-downtime security upgrades across 2,500 hosts by upgrading 10 microservices with staged rollouts and deployment safeguards.'
      - 'Accelerated engineer ramp time for 4 new engineers by establishing code review cadences, enforcing engineering standards, and mentoring across multiple microservices.'
