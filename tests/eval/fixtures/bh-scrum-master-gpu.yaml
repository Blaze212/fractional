assert:
  # Stretch fit: no Scrum certs in profile — output must not fabricate them
  - type: javascript
    value: |
      const text = (output.fit_summary + ' ' + output.fit_bullets.map(b => b.text).join(' ')).toLowerCase()
      return !text.includes('psm') && !text.includes('csm') && !text.includes('certified')
  # Agile sprint participation IS in the profile — output should reference it
  - type: javascript
    value: |
      const text = (output.fit_summary + ' ' + output.fit_bullets.map(b => b.text).join(' ')).toLowerCase()
      return text.includes('agile') || text.includes('sprint')
  # Quality: honest positioning without inflating into a Scrum Master identity
  - type: llm-rubric
    value: |
      The narrative honestly positions Barton as a software engineer with Agile participation experience
      (sprint cycles at Lockheed Martin) rather than fabricating a Scrum Master identity. It does not
      claim he holds PSM, CSM, or any Scrum certification. It acknowledges the stretch nature of the
      fit — his background is engineering rather than process facilitation — while noting whatever
      genuine Agile experience he brings.
