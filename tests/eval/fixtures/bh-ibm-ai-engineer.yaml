assert:
  # Azure-specific services are not in the profile — output must not fabricate them
  - type: javascript
    value: |
      const text = (
        (output.fit_summary || '') + ' ' +
        (output.fit_bullets || []).map(b => b.text || '').join(' ')
      ).toLowerCase()
      const azureSpecific = ['azure openai', 'azure ml', 'azure ai studio', 'azure machine learning']
      return !azureSpecific.some(phrase => text.includes(phrase))
  # Agentic AI and LLM work IS in the profile — must be referenced
  - type: javascript
    value: |
      const text = (
        (output.fit_summary || '') + ' ' +
        (output.fit_bullets || []).map(b => b.text || '').join(' ')
      ).toLowerCase()
      return (
        text.includes('agentic') ||
        text.includes('llm') ||
        text.includes('ai pipeline') ||
        text.includes('agent orchestration') ||
        text.includes('document processing') ||
        text.includes('ai workflow')
      )
  # Quality: leads with AI depth, handles Azure gap honestly
  - type: llm-rubric
    value: |
      The narrative honestly leads with Barton's strong AI engineering depth — agentic
      workflows, LLM integration, RAG, prompt engineering, and cloud-native CI/CD — without
      fabricating or implying Azure-specific experience (Azure OpenAI, Azure ML, or Azure AI
      Studio) that does not appear in his profile. It positions him as a strong AI engineer
      with deep AWS cloud and distributed-systems experience whose skills are transferable to
      Azure, rather than presenting him as an Azure specialist. The platform gap is either
      acknowledged candidly or handled by framing his cloud skills as broadly applicable,
      but the output does not assert Azure expertise he does not have.
