  jd_text: |
    IBM Consulting is seeking a skilled AI Engineer for an active enterprise AI engagement
    in a hands-on, client-facing capacity. Senior individual contributor role requiring deep
    technical proficiency in Agentic AI. Will operate independently, interact directly with
    the client, and deliver with minimal oversight. Focus on building, fine-tuning, and
    operationalizing AI solutions on Azure.

    What you will do:
    - Design, build, and deploy agentic AI workflows and multi-agent systems using Azure OpenAI and supporting frameworks
    - Develop and optimize prompt engineering strategies to maximize model performance and reliability
    - Build and maintain Retrieval-Augmented Generation (RAG) pipelines for grounded, context-aware AI responses
    - Implement agent orchestration patterns including tool calling, memory management, and human-in-the-loop workflows
    - Engage directly with client stakeholders to gather requirements, demo capabilities, and walk through technical solutions
    - Communicate clearly on progress, blockers, and technical tradeoffs
    - Deploy and manage AI models using Azure ML, Azure AI Studio, or equivalent Azure services
    - Integrate AI capabilities into enterprise applications via APIs, event-driven pipelines, and microservices
    - Establish monitoring, evaluation, and feedback loops for ongoing model performance in production
    - Ensure solutions meet enterprise standards for security, scalability, and compliance

    Required:
    - 7+ years designing, developing, and deploying scalable AI applications leveraging LLMs, RAG architectures, and agentic AI workflows
    - Build and operationalize AI orchestration pipelines using LangChain and LangGraph
    - Develop AI agents capable of tool calling, contextual retrieval, memory/state management, multi-agent coordination, and autonomous workflow execution
    - Implement MCP (Model Context Protocol) integration patterns
    - CI/CD, LLMOps/MLOps, and cloud-native deployment practices

    Preferred:
    - LangChain, LangGraph, AutoGen, Semantic Kernel, or CrewAI experience
    - Vector databases (Azure AI Search, Pinecone, Weaviate)
    - Enterprise integration patterns connecting AI to CRMs, ERPs, or data platforms
    - Master's Degree preferred
