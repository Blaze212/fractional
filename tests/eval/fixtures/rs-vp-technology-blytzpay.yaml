assert:
  # Grounding is the priority here: the role is a hands-on software-engineering VP
  # (NodeJS, Kubernetes, RESTful APIs, distributed systems) and the candidate is an
  # IT operations leader with NONE of that stack. The model must not fabricate it.
  - type: javascript
    value: |
      const s = (output.fit_summary + ' ' + output.fit_bullets.map(b => b.text).join(' ') + ' ' + output.key_qualifications.map(b => b.text).join(' ')).toLowerCase()
      // Guard against the most tempting hallucinations — coding-stack claims the
      // profile never supports.
      return !['nodejs', 'node.js', 'kubernetes', 'restful api', 'rest api', 'playwright', 'snyk', 'checkmarx', 'distributed systems'].some(k => s.includes(k))
  - type: llm-rubric
    value: |
      This is a low-fit / skills-gap scenario. The role is a HANDS-ON software
      engineering VP for a NodeJS payments platform (NodeJS/JavaScript architecture,
      Kubernetes, GCP, RESTful APIs, distributed systems, secure SDLC tooling, test
      automation). The candidate is an IT OPERATIONS leader and has none of that
      software-engineering background. A correct output must:
      1. Stay strictly grounded: it must NOT claim or imply NodeJS/JavaScript
         development, Kubernetes, API/distributed-systems engineering, secure-coding
         tools (Snyk/Checkmarx), or test automation experience, because none appear
         in the profile.
      2. Lean honestly on the genuine overlap: security and compliance (SOX, PCI),
         identity and access management (Okta SSO/SCIM/MFA), large-scale
         migrations, reliability/uptime, automation, vendor/budget ownership, and
         technology-organization leadership.
      3. Not pad the narrative with invented technical specifics to mask the gap.
         Qualitative, transferable framing of his real leadership and
         security/reliability experience is acceptable.
