description: 'IT operations director vs. hands-on fintech engineering-VP JD (low fit / skills-gap grounding test)'

vars:
  client_name: BlytzPay
  role_title: VP of Technology
  jd_text: |
    BlytzPay is modernizing payments in complex, regulated repayment environments.
    As we enter our next growth phase, we're hiring a hands-on VP of Technology to
    lead architecture, engineering scale, and platform reliability. This is an
    executive builder role — ideal for a technology leader who can operate
    strategically while staying close to the stack.

    What you'll own: technical vision and platform architecture; engineering team
    scale and performance; cloud infrastructure (GCP preferred, AWS acceptable);
    Kubernetes-based container orchestration; high-volume RESTful API systems;
    platform observability (Splunk, DataDog, Prometheus, etc.); security and
    compliance alignment (SOC 2 Type 2 and/or PCI); fault-tolerant, scalable system
    design. You'll ensure our NodeJS-based platform scales securely in a regulated
    payments environment while maintaining engineering velocity.

    What you bring: 10+ years of engineering leadership experience; strong
    JavaScript / NodeJS architecture background; deep experience building RESTful
    APIs and distributed systems; Kubernetes and cloud-native infrastructure
    expertise; SQL and data warehousing experience; experience embedding secure
    development practices (Snyk, Checkmarx, etc.); test automation experience
    (Playwright preferred); familiarity with synthetic testing and proactive
    monitoring; background in fintech, payments, or other transaction-heavy systems.
