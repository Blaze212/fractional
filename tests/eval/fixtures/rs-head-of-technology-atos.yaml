assert:
  # Scenario-specific: the narrative should lean on his real transformation,
  # automation, AI-adoption, and compliance work — the closest bridges to this role.
  - type: javascript
    value: |
      const s = (output.fit_summary + ' ' + output.fit_bullets.map(b => b.text).join(' ') + ' ' + output.key_qualifications.map(b => b.text).join(' ')).toLowerCase()
      return ['transformation', 'automation', 'copilot', 'ai', 'compliance', 'sox', 'pci', 'leadership'].some(k => s.includes(k))
  - type: llm-rubric
    value: |
      This is a stretch / partial-fit scenario: the candidate is an internal IT
      operations leader, while the role is an outward-facing, client-facing
      technology-evangelism and sales-enablement executive. A strong output must:
      1. Build the case from the candidate's REAL strengths — enterprise IT
         leadership, technology transformation, automation, AI (Copilot) adoption,
         security/compliance (SOX, PCI), vendor and budget ownership, and
         large-team leadership.
      2. NOT invent client-facing, pre-sales, consulting, hyperscaler-partnership,
         CTO/Chief-Architect, or sales-pursuit experience that is absent from the
         profile. Transferable framing of his real experience toward the role is
         acceptable; fabricated experience is not.
      3. Avoid implying he has done the specific outward-facing activities the JD
         requires (evangelism to prospects, executive briefings with clients,
         co-selling with partners) unless grounded in the profile.
