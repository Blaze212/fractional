description: 'IT operations director vs. outward-facing tech-evangelist exec JD (partial fit / stretch role)'

vars:
  client_name: Atos North America
  role_title: Head of Technology
  jd_text: |
    The Head of Technology (HoT) for Atos North America is a senior, market-facing
    technology executive responsible for shaping and evangelizing the regional
    technology vision, driving innovation-led growth, and enabling sales through
    differentiated technical strategy and thought leadership. This role is primarily
    outward-facing and focused on technology evangelism, client influence, and sales
    enablement, working closely with sales, client management, marketing, partners,
    and global innovation teams. The HoT serves as a trusted advisor to clients and
    prospects, translating complex technologies into compelling business value while
    aligning North American priorities with Atos's global transformation agenda.

    Key responsibilities: define and articulate the North American technology vision
    across cloud, cybersecurity, AI/ML, data platforms, automation, and digital
    transformation; lead executive-level technical discussions and value-based
    solution narratives with C-suite clients; partner with sales and marketing to
    support strategic pursuits, large deals, and competitive bids; build relationships
    with Hyperscalers (AWS, Azure, Google Cloud); evangelize security-by-design and
    compliance (FedRAMP, HIPAA, PCI, SOC2) as core to Atos's value proposition;
    mentor senior architects and technical leaders in client-facing, advisory, and
    pre-sales roles.

    Required: 15+ years of senior technology leadership experience in global IT
    services, consulting, cloud, or enterprise technology organizations; deep expertise
    in cloud platforms, AI/ML, cybersecurity, data, and digital transformation; strong
    experience in client-facing, pre-sales, and advisory roles influencing executive
    stakeholders; excellent communication, presentation, and storytelling skills for
    executive and public forums. Preferred: experience in regulated industries; prior
    experience as a CTO, Chief Architect, Distinguished Engineer, or senior technology
    evangelist; experience supporting large-scale strategic deals and transformational
    sales pursuits.
  parsed_profile:
    name: Russell C. Sedgwick
    email: russsedg@gmail.com
    phone: 801-598-8279
    location: null
    linkedin_url: linkedin.com/in/russsedg/
    current_title: Senior Director of Enterprise IT
    work_authorization: No Sponsorship Required
    total_experience: '15+ years'
    summary: >-
      IT Operations leader with 15+ years owning end-to-end technology operations —
      service desk, systems engineering, identity, endpoint, and enterprise SaaS
      platforms — at a publicly traded company. Proven record of building
      high-performing teams, delivering reliable and secure IT services, and
      implementing scalable processes that support mission-critical business
      operations. Skilled in driving automation, governance, and standardization to
      improve service delivery, strengthen security posture, and enable scalable
      organizational growth in complex, highly regulated environments.
    seniority_level: Senior Director
    career_highlights:
      - 'Reduced technology operating costs $2M+ by consolidating vendors, optimizing contracts, and decommissioning redundant tools and legacy systems'
      - 'Increased endpoint governance coverage from ~75% to 99%+ by partnering with security to implement standardized device security policies and centralized compliance controls'
      - 'Reduced manual IT effort 30% by automating workflows, accelerating service delivery, and improving user experience'
      - 'Improved IT employee satisfaction (ESAT) 20% by building high-performing teams aligned to business priorities and fostering a strong performance culture'
      - 'Completed data center migration with zero unplanned downtime by sequencing workloads based on dependencies, standardizing migration runbooks, and executing controlled cutover plans'
      - 'Helped 10+ individuals earn promotions by mentoring, delivering targeted training, and implementing structured career development plans'
    selected_experience:
      - company: Bed Bath & Beyond (formerly Overstock.com)
        title: Senior Director of Enterprise IT
        start_date: '2016'
        end_date: Present
        responsibilities:
          - 'Lead teams of up to 25 direct and indirect reports and own a $4M IT budget, owning IT operations strategy supporting 2000+ employees across multiple locations in mission-critical environments'
          - 'Collaborate with executive leadership, cybersecurity, and business stakeholders to enforce compliance, prioritize initiatives, and drive measurable outcomes'
          - 'Partner with security engineering to ensure compliance with industry regulations such as SOX and PCI through governance controls and risk management practices'
          - 'Align team resources and priorities with business objectives, driving efficiency through automation and self-service tools'
        achievements:
          - 'Improved endpoint compliance to 99%+ across Windows and macOS devices by implementing centralized management tools and configuration baselines'
          - 'Reduced onboarding time for new employees 50% by automating account provisioning, creating role-based access entitlements, and documenting processes'
          - 'Improved service desk satisfaction 25% by implementing SLAs, KPIs, and performance accountability frameworks'
          - 'Improved hardware forecast accuracy to 95% by standardizing lifecycle management and procurement strategy aligned to workforce planning'
          - 'Drove adoption of Microsoft Copilot across ~25% of the workforce by leading a proof-of-concept and delivering structured enablement, training, and responsible AI rollout practices'
      - company: Overstock.com
        title: Manager of Corporate Systems
        start_date: '2013'
        end_date: '2015'
        responsibilities:
          - 'Led and developed a team of 8 Systems Engineers and Administrators supporting enterprise infrastructure and mission-critical business applications'
          - 'Ensured high availability, performance, and reliability across enterprise systems supporting corporate operations'
          - 'Established operational priorities and service delivery standards improving efficiency and user experience'
        achievements:
          - 'Reduced app access provisioning time 30% by implementing Okta across 200+ applications, enabling SSO, SCIM, and MFA while strengthening security posture'
          - 'Led the migration of on-premises Exchange to Office 365, ensuring a seamless transition with zero data loss'
          - 'Improved system uptime to 99.9%+ by optimizing operational performance through proactive monitoring, standardization, and process improvements'
          - 'Promoted 3 times by increasing scope of responsibilities (previous titles: Lead System Engineer, System Engineer, System Administrator)'
    other_experience:
      - company: Idaho Central Credit Union
        title: System Administrator
        start_date: null
        end_date: null
    education:
      - institution: Western Governors University
        degree: MBA, IT Management
      - institution: Weber State University
        degree: BS, Computer Science
    certifications:
      - provider: Microsoft
        certification: MCP
      - provider: Microsoft
        certification: MCSA
    skills:
      - IT operations strategy
      - Technology transformation
      - Service desk management
      - Infrastructure management
      - Identity and access management (IAM)
      - MDM
