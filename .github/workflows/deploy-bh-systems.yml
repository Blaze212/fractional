name: Deploy bh-systems

on:
  push:
    branches: [main]
    paths:
      - 'apps/bh-systems/**'
      - '.github/workflows/deploy-bh-systems.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    environment:
      name: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/bh-systems
          wranglerVersion: '4'
          command: deploy
