name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-lint-test:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.1.4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # ── bh-delivery kit (spec 029 B-5) ────────────────────────────────────────
      # The delivery machinery lives in Blaze212/bh-delivery, not in this repo; the
      # scripts/*.sh here are three-line shims onto it. CI has no plugin manager, so it
      # checks the kit out at the tag this repo pins and points BH_DELIVERY_ROOT at it.
      # Pinned tag, never a moving ref: a kit whose scripts disagree with the profile they
      # read is exactly the drift the kit exists to end.
      - name: Read the pinned kit version
        id: kit
        run: |
          v="$(grep -E '^kit_version:' .claude/delivery-profile.yaml | head -1 \
            | sed -E "s/^kit_version:[[:space:]]*//; s/[\"']//g; s/[[:space:]]*(#.*)?$//")"
          [ -n "$v" ] || { echo "no kit_version in .claude/delivery-profile.yaml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "pinned kit_version: $v"

      - name: Check out the bh-delivery kit
        uses: actions/checkout@v4
        with:
          repository: Blaze212/bh-delivery
          ref: refs/tags/v${{ steps.kit.outputs.version }}
          token: ${{ secrets.BH_DELIVERY_TOKEN }}
          path: .bh-delivery

      - name: Point the shims at the checked-out kit
        run: |
          echo "BH_DELIVERY_ROOT=$GITHUB_WORKSPACE/.bh-delivery" >> "$GITHUB_ENV"
          node -e 'console.log("kit version:", JSON.parse(require("fs").readFileSync(".bh-delivery/.claude-plugin/plugin.json","utf8")).version)'

      - name: Delivery profile and kit shims
        run: scripts/tests/run.sh

      - run: pnpm install --frozen-lockfile
      # - name: Dependency vulnerability audit
      #   run: pnpm audit --audit-level=high

      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test:unit:coverage

      # - name: Start Supabase local development setup
      #   run: supabase db start
      # - name: Verify generated types are checked in
      #   run: |
      #     supabase gen types typescript --local > types.gen.ts
      #     if ! git diff --ignore-space-at-eol --exit-code --quiet types.gen.ts; then
      #       echo "Detected uncommitted changes after build. See status below:"
      #       git diff
      #       exit 1
      #     fi

  supabase-migrate-and-deploy:
    name: Supabase Migrate & Deploy Functions
    runs-on: ubuntu-latest
    environment:
      name: Production
    needs: [typecheck-lint-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      statuses: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        # fail early with a clear message if any required secret is missing
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Run DB migrations
        run: supabase db push

      - name: Deploy edge functions
        run: supabase functions deploy

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    environment:
      name: Production
    needs: [typecheck-lint-test, supabase-migrate-and-deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      CF_DEPLOY_HOOK_PORTAL: ${{ secrets.CF_DEPLOY_HOOK_PORTAL }}

    steps:
      - name: Trigger portal deploy
        run: curl -X POST "$CF_DEPLOY_HOOK_PORTAL"

  deploy-bh-systems:
    name: Deploy bh-systems to Cloudflare Workers
    runs-on: ubuntu-latest
    environment:
      name: Production
    needs: [typecheck-lint-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GAS_EXEC_URL: ${{ secrets.GAS_EXEC_URL }}

    steps:
      - uses: actions/checkout@v4

      # GAS_EXEC_URL is a Worker secret, not a var, so `wrangler deploy` alone
      # never sets it — re-push it on every deploy so it can't silently go
      # missing (as opposed to relying on someone running `wrangler secret
      # put` by hand and it never being touched again).
      - name: Sync GAS_EXEC_URL Worker secret
        run: echo "$GAS_EXEC_URL" | npx wrangler@4 secret put GAS_EXEC_URL
        working-directory: apps/bh-systems

      - name: Deploy bh-systems Worker
        run: bash scripts/deploy.sh
        working-directory: apps/bh-systems

  deploy-adjuster:
    name: Deploy Adjuster Apps Script
    runs-on: ubuntu-latest
    environment:
      name: Production
    needs: [typecheck-lint-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      GAS_DEPLOY_ID: ${{ secrets.GAS_DEPLOY_ID }}
      CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}

    steps:
      - uses: actions/checkout@v4

      # Auth file and the clasp commands that read it both run from
      # apps/adjuster, and --auth is passed explicitly on each command
      # rather than via clasp's clasp_config_auth env var — that env var
      # resolves relative to whatever cwd clasp happens to run from, which
      # is easy to break silently by changing a step's working-directory
      # later without noticing it also has to match this path.
      - name: Push and redeploy Apps Script
        working-directory: apps/adjuster
        run: |
          echo "$CLASP_CREDENTIALS" > .clasprc.json
          npx @google/clasp --auth .clasprc.json push -f
          npx @google/clasp --auth .clasprc.json redeploy "$GAS_DEPLOY_ID" -d "CI deploy ${{ github.sha }}"
